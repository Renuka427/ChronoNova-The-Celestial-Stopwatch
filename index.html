<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starfield Stopwatch with Lap Button</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
      
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center; 
            align-items: center; 
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(to bottom, #3e0a45, #000); 
        }

       
        .starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .starfield .star {
            position: absolute;
            border-radius: 50%;
            background-color: #fff;
            animation: moveStars 20s infinite linear;
        }

        @keyframes moveStars {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) translateX(100vw);
                opacity: 0;
            }
        }

       
        .stopwatch-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
        }

        
        .stopwatch {
            position: relative;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #222, #111);
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6), inset 0 2px 10px rgba(255, 255, 255, 0.2);
        }

        .outer-circle {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 280px;
            height: 280px;
            margin: 10px auto;
            background: radial-gradient(circle, #444, #222);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.8), 0 0 25px rgba(0, 255, 255, 0.6), 0 0 35px rgba(0, 255, 255, 0.4);
        }

        .inner-circle {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 220px;
            height: 220px;
            background: #000;
            border-radius: 50%;
            box-shadow: inset 0 5px 15px rgba(0, 0, 0, 0.6);
        }

        .display {
            font-size: 2.6rem;
            margin-bottom: 20px;
            color: #0ff;
            font-family: 'Courier New', Courier, monospace;
        }

   
        .outer-ring-buttons {
            position: absolute;
            top: -40px;
            display: flex;
            justify-content: center;
            gap: 40px;
        }

        .lap-button-container {
            position: relative;
            margin-top: 20px; 
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .lap-ring {
            width: 70px;
            height: 70px;
            border: 3px solid #0ff; 
            border-radius: 50%;
            transition: transform 0.3s ease, opacity 0.5s ease;
            opacity: 0.8;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.8);
        }

        .lap-ring:hover {
            transform: scale(1.2); 
            opacity: 1;
        }

        .lap-name-card {
            position: absolute;
            bottom: 80px; 
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 255, 255, 0.8); 
            padding: 10px 20px;
            border-radius: 8px;
            color: #fff;
            font-size: 1.2rem;
            font-family: 'Courier New', Courier, monospace;
            display: none;  
            box-shadow: 0 4px 10px rgba(0, 255, 255, 0.5);
            animation: slideIn 0.5s forwards;
        }

        @keyframes slideIn {
            0% {
                transform: translateX(-50%) translateY(20px);
                opacity: 0;
            }
            100% {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }

        .lap-button-container:hover .lap-name-card {
            display: block;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 35px;
            padding: 0px;
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 900px;
            height: 400px;
            margin-left: 40px;
            z-index: 2;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .glass-card h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .glass-card p {
            font-size: 1.4rem;
            margin-top: 10px;
            text-align: center;
            line-height: 1.5;
        }

        .container {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            width: 100%;
            height: 100vh;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="starfield">
    </div>
    <div class="container">
        <div class="stopwatch-container">
            <div class="stopwatch">
                <div class="outer-circle">
                    <div class="inner-circle">
                        <div class="display">00:00:00</div>
                        <div class="outer-ring-buttons">
                            <div class="button-top" id="top-btn-1">
                                <div class="tooltip">Start</div>
                            </div>

                            <div class="button-top" id="top-btn-2">
                                <div class="tooltip">Stop</div>
                            </div>

                            <div class="button-top" id="top-btn-3">
                                <div class="tooltip">Reset</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="lap-button-container">
            <div class="lap-ring" id="lap-ring"></div> 
            <div class="lap-name-card" id="lap-name-card">Lap</div> 
        </div>

        <div class="glass-card">
            <h1>Lap History</h1>
            <ul class="lap-history">
            </ul>
        </div>
    </div>

    <script>
        const starfield = document.querySelector('.starfield');

        for (let i = 0; i < 200; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            star.style.width = `${Math.random() * 3 + 1}px`;  
            star.style.height = star.style.width;  
            star.style.top = `${Math.random() * 100}vh`;
            star.style.left = `${Math.random() * 100}vw`;
            star.style.animationDuration = `${Math.random() * 3 + 10}s`;  
            starfield.appendChild(star);
        }

        const display = document.querySelector('.display');
        const startButton = document.getElementById('top-btn-1');  
        const stopButton = document.getElementById('top-btn-2');   
        const resetButton = document.getElementById('top-btn-3');  
        const lapRing = document.getElementById('lap-ring');  
        const lapNameCard = document.getElementById('lap-name-card');  
        const lapHistoryList = document.querySelector('.lap-history');  

        let timer = null;
        let elapsedTime = 0;
        let lapTimes = [];  

        function formatTime(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            const milliseconds = Math.floor((ms % 1000) / 10);
            return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}:${String(milliseconds).padStart(2, '0')}`;
        }

        function updateDisplay() {
            display.textContent = formatTime(elapsedTime);
        }

        function startTimer() {
            if (!timer) {
                const startTime = Date.now() - elapsedTime;
                timer = setInterval(() => {
                    elapsedTime = Date.now() - startTime;
                    updateDisplay();
                }, 10);
                startButton.disabled = true;
                stopButton.disabled = false;
                speakMessage('Timer Started');
            }
        }

        function stopTimer() {
            clearInterval(timer);
            timer = null;
            startButton.disabled = false;
            stopButton.disabled = true;
            speakMessage('Timer Stopped');
        }

        function resetTimer() {
            elapsedTime = 0;
            lapTimes = [];
            updateDisplay();
            lapHistoryList.innerHTML = '';  
            speakMessage('Timer Reset');
        }

        function recordLap() {
            if (timer) {
                lapTimes.push(elapsedTime);
                const lapTime = formatTime(elapsedTime);

                const lapItem = document.createElement('li');
                lapItem.textContent = `Lap ${lapTimes.length}: ${lapTime}`;

                lapHistoryList.appendChild(lapItem);
                speakMessage(`Lap ${lapTimes.length} recorded: ${lapTime}`);
            }
        }

        function speakMessage(message) {
            const speech = new SpeechSynthesisUtterance(message);
            speech.rate = 1;  
            speech.pitch = 1;
            window.speechSynthesis.speak(speech);
        }

        startButton.addEventListener('click', startTimer);  
        stopButton.addEventListener('click', stopTimer);    
        resetButton.addEventListener('click', resetTimer);  

        lapRing.addEventListener('click', recordLap);  
    </script>
</body>
</html>
